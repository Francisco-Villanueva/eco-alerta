<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#265a4a">
  <meta name="description" content="Reciclaje inteligente para cada comunidad">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EcoAlerta">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>EcoAlerta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Bienvenida / cambio de localidad -->
    <section id="bienvenida" class="bienvenida" hidden>
      <div class="bienvenida-caja">
        <div class="logo-grande" id="logo-bienvenida"></div>
        <h1>Reciclá con los horarios de tu barrio</h1>
        <p class="sub">Elegí dónde vivís y te mostramos cuándo pasa el camión y adónde llevar cada residuo.</p>

        <label for="sel-localidad">Localidad</label>
        <select id="sel-localidad"></select>

        <div id="grupo-zona" hidden>
          <label for="sel-zona">Zona</label>
          <select id="sel-zona"></select>
        </div>

        <p id="aviso-demo" class="aviso" hidden>Esta localidad usa datos ficticios de demostración.</p>
        <button id="btn-empezar" class="btn">Empezar</button>
        <button id="btn-cancelar" class="btn btn-sec" hidden>Cancelar</button>
      </div>
    </section>

    <!-- App principal -->
    <header id="cabecera" class="cabecera" hidden>
      <div class="marca">
        <span id="logo-cabecera" class="logo-marca"></span>
        <b>EcoAlerta</b>
      </div>
      <button id="btn-cambiar" class="chip" aria-label="Cambiar localidad"></button>
    </header>

    <main id="principal" hidden>
      <section id="tab-inicio" class="tab"></section>
      <section id="tab-calendario" class="tab" hidden></section>
      <section id="tab-mapa" class="tab" hidden></section>
      <section id="tab-guia" class="tab" hidden></section>
      <section id="tab-noticias" class="tab" hidden></section>
      <section id="tab-ajustes" class="tab" hidden></section>
    </main>

    <nav id="nav" class="nav" hidden></nav>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
